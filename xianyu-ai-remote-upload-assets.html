  <script>
    const status = document.querySelector('.status');
    const imageLinks = [
      'https://ronnie2025.github.io/ai-agent-workbench-starter-pack/xianyu-ai-remote-upload-assets/01-ai-remote-data-job-cover.png',
      'https://ronnie2025.github.io/ai-agent-workbench-starter-pack/xianyu-ai-remote-upload-assets/02-deliverables.png',
      'https://ronnie2025.github.io/ai-agent-workbench-starter-pack/xianyu-ai-remote-upload-assets/03-how-to-use.png',
      'https://ronnie2025.github.io/ai-agent-workbench-starter-pack/xianyu-ai-remote-upload-assets/04-boundary.png'
    ];

    async function copyText(text, message) {
      try {
        await navigator.clipboard.writeText(text);
        status.textContent = message;
      } catch (error) {
        const helper = document.createElement('textarea');
        helper.value = text;
        helper.setAttribute('readonly', '');
        helper.style.position = 'fixed';
        helper.style.left = '-9999px';
        document.body.appendChild(helper);
        helper.select();
        const copied = document.execCommand('copy');
        helper.remove();
        status.textContent = copied ? message : '浏览器未允许复制，请打开原图链接';
      }
    }

    document.querySelectorAll('[data-copy]').forEach((button) => {
      button.addEventListener('click', () => copyText(button.dataset.copy, '已复制图片链接'));
    });

    document.querySelector('[data-copy-all]').addEventListener('click', () => {
      copyText(imageLinks.join('\n'), '已复制 4 个图片链接');
    });

    document.querySelector('[data-copy-field]').addEventListener('click', () => {
      const field = document.querySelector('textarea').value;
      copyText(field, '已复制上架字段');
    });
  </script>
